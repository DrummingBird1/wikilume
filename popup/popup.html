<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WikiFree</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="app">
    <header class="top">
      <svg viewBox="0 0 32 32" class="logo" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#14b8a6"/></linearGradient></defs>
        <rect width="32" height="32" rx="8" fill="url(#g)"/>
        <path d="M7 10l4.5 12L16 13l4.5 9L25 10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>WikiFree</h1>
        <p id="free"></p>
      </div>
    </header>

    <div class="seg" id="tabs" role="tablist"></div>

    <section id="panelSaved" class="panel" role="tabpanel">
      <input type="text" id="bmFilter" autocomplete="off">
      <ul class="wf-bmlist" id="bmList"></ul>
      <p class="empty" id="bmEmpty"></p>
      <div class="bm-foot">
        <button type="button" id="bmExport"></button>
      </div>
    </section>

    <section id="panelSettings" class="panel" role="tabpanel" hidden>
      <label class="row switch">
        <span><b id="enableLabel"></b><small id="enableHint"></small></span>
        <input type="checkbox" id="enabled">
      </label>

      <section class="row">
        <span class="label" id="themeLabel"></span>
        <div class="seg" id="theme"></div>
      </section>

      <label class="row switch">
        <span><b id="previewsLabel"></b></span>
        <input type="checkbox" id="previews">
      </label>

      <section class="row">
        <span class="label" id="langLabel"></span>
        <select id="uiLang"></select>
      </section>

      <footer>
        <small id="hint"></small>
        <small id="about"></small>
      </footer>
    </section>
  </main>
  <script src="../src/i18n.js"></script>
  <script src="../src/bookmarks.js"></script>
  <script src="popup.js"></script>
</body>
</html>
