name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # static checks + unit tests; the headless-Chrome checks (npm run e2e) are run by hand
      - run: npm run verify
